name: Main source policy
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: main-source-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  source:
    name: Main source policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only trusted BASE code. Never check out or execute the PR's contents.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require same-repository development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/main_source_policy.py
